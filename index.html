            body += '<ellipse cx="' + x + '" cy="' + y + '" rx="' + p[i + 3] / 2 + '" ry="' + p[i + 4] / 2 + '"' + (p[i + 5] ? ' transform="rotate(' + p[i + 5] * 2 + ' ' + x + ' ' + y + ')"' : '') + ' fill="url(#' + g + ')"' + (p[i + 6] < 50 ? ' fill-opacity="' + p[i + 6] / 50 + '"' : '') + '/>';
          }
          return (cache[n] = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 ' + c.h + '" width="640" height="' + c.h + '"><defs>' + defs + '</defs><g clip-path="url(#' + id + 'c)"><rect width="640" height="' + c.h + '" fill="url(#' + id + 'b)"/>' + body + '</g></svg>');
        }

        var SVG = cloudSVG(1), SOLID = SVG.replace(/<defs>[\s\S]*$/, '') + '<path d="' + SVG.match(/ d="([^"]+)"/)[1] + '" fill="#FFFEFC"/></svg>';

    </script>
    <script>
      // The GitHub-return cover, shared with ArrivalClouds.jsx: a solid bank of plain-white clouds over the pale inside-the-cloud
      // fill, and the golden feather loader (shimmer, sparkles, three dots). Coming back from GitHub, the page draws it as its
      // very first frame, so the half-open intro clouds never show; the game takes it over in place (same markup, same clocks).
      (function () {
        // the feather loader: a soft light glides up the feather and two gold stars bloom at its tip (the title's
        // shimmer and letter stars), with words under it whose three dots hop in turn
        var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); };
        window.EWArrival = {
          t0: null, guest: false,
          clouds: [[1, 'l', -34], [2, 'r', -30], [3, 'l', 0], [4, 'r', 4], [5, 'l', 34], [6, 'r', 38], [7, 'b', 60], [8, 'b', 92]],   // the last one fills the bottom of a tall phone
          loader: function (text) {
            return '<div class="arrival-feather"><img src="/guest/feather-loader.svg" alt="" width="96" height="96"><div class="arrival-shine"><i></i></div><b class="arrival-gl"></b><b class="arrival-gl sm"></b></div>' +
              (text ? '<p class="arrival-msg">' + esc(text) + '<i>.</i><i>.</i><i>.</i></p>' : '');
          },
        };
        // draws the cover into the page's own layer (#boot-sky), which the game removes once its own copy is up.
        // 'cover': already closed (first frame back from GitHub); 'close': the clouds close in over the end screen (Watch as a guest)
        EWArrival.mount = function (phase, text) {
          var sky = document.getElementById('boot-sky');
          if (!sky) { sky = document.createElement('div'); sky.id = 'boot-sky'; sky.setAttribute('aria-hidden', 'true'); sky.style.cssText = 'position:fixed;inset:0;pointer-events:none'; document.body.append(sky); }
          sky.dataset.arrive = '1'; sky.style.background = 'none'; sky.style.zIndex = '40';
          sky.innerHTML = '<div class="arrival" data-phase="' + phase + '"><div class="arrival-sky"></div>' +
            EWArrival.clouds.map(function (c, i) { return '<img class="arrival-cloud" data-side="' + c[1] + '" style="--y:' + c[2] + 'vh;--i:' + i + '" src="' + EWClouds.url(c[0], true) + '" alt="">'; }).join('') +
            '<div class="arrival-loader" role="status">' + EWArrival.loader(text) + '</div></div>';
          EWArrival.t0 = performance.now();
          document.documentElement.classList.remove('ew-arrive');
        };
        var arriving = false;
        try { arriving = sessionStorage.getItem('ew-arrive') === '1'; } catch (e) {}
        if (arriving) EWArrival.mount('cover', 'Landing on your island');
        // a signed-in reload comes in under the same cloud cover, which parts once the island is drawn
        else if (document.documentElement.classList.contains('ew-connecting')) EWArrival.mount('cover', 'Connecting to your island');
      })();
    </script>
    <script>
      (function () {
        var sky = document.getElementById('boot-sky'), W = innerWidth, H = innerHeight, t0 = performance.now();
        if (sky.dataset.arrive) return;   // coming back from GitHub: the cover is already drawn
        // how far along the shared cloud path the page's clouds are (Landing.jsx picks them up from here)
        window.__bootP = function () { return Math.min(.25, (performance.now() - t0) / 5000 * .25); };
        // the same five clouds and the same first-frame placement as the intro (WHOOSH in Landing.jsx at t = 0)
        [[-.28, .18, 1.05, 2], [.32, .3, 1.15, 3], [-.04, .55, 1.4, 1], [.42, -.12, .8, 6], [-.45, -.2, .75, 4]].forEach(function (c) {
          var img = document.createElement('img'), x = c[0] * W, y = c[1] * H, k = c[2] * Math.max(W, H * .75) / 300 * 1.25;
          img.src = EWClouds.url(c[3]); img.alt = '';
          img.style.cssText = 'position:absolute;left:50%;top:50%;width:300px;height:auto;transform:translate(-50%,-50%) translate(' + x + 'px,' + y + 'px) scale(' + k + ')';
          sky.append(img);
          // never a still frame: the clouds already drift apart along the intro's own whoosh path (placeWhoosh in
          // Landing.jsx at p = .25 after 5 s, linear), so the intro can pick them up exactly where they are
          img.animate([{}, {transform:'translate(-50%,-50%) translate(' + x * 1.325 + 'px,' + (y + H * .6) + 'px) scale(' + k * 1.22 + ')'}],
            {duration:5000, easing:'linear', fill:'forwards'});
        });
      })();
    </script>
    <div id="root"></div>
